---
services:
  wetty:
    container_name: wetty
    restart: unless-stopped
    ports:
      - 4022:3000
    image: wettyoss/wetty
    # The /etc/netpi/ip_address file is written by the playbook in all modes
    # (auto-detected IP, static IP and Tailscale IP).
    command: --ssh-host={{ lookup('file', '/etc/netpi/ip_address') }}
