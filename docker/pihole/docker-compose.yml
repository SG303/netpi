services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: host
    environment:
   #   TZ: 'Etc/UTC'
      # Pi-hole v6 configuration (v5 variables like WEBPASSWORD / WEB_PORT are no longer supported)
      FTLCONF_webserver_api_password: 'password'
      FTLCONF_webserver_port: '3015'
      FTLCONF_dns_listeningMode: 'all'
    volumes:
      - './etc-pihole:/etc/pihole'
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
