---
services:
  homer:
    image: b4bz/homer:latest
    container_name: homer
    restart: unless-stopped
    volumes:
      - ./assets/:/www/assets
    ports:
      - 80:8080
    user: 1000:1000 # default
    environment:
      - INIT_ASSETS=0 # default
  # CORSair provides the CORS proxy used by the Homer status checks.
  # Its configuration is rendered from corsair/config.yaml.j2 by Ansible.
  corsair:
    image: b4bz/corsair:latest
    restart: unless-stopped
    ports:
      - 3333:8080
    volumes:
      - ./corsair/:/etc/corsair/
