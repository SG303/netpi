---
services:
  some-sftpgo:
    image: drakkan/sftpgo:latest
    container_name: sftpgo
    restart: unless-stopped
    ports:
      - "3016:8080"
      - "2022:2022"
      - "2121:2121"
      - "50000-50100:50000-50100"
    environment:
      - SFTPGO_FTPD__BINDINGS__0__PORT=2121
      # The /etc/netpi/ip_address file is written by the playbook in all modes
      # (auto-detected IP, static IP and Tailscale IP).
      - SFTPGO_FTPD__BINDINGS__0__FORCE_PASSIVE_IP={{ lookup('file', '/etc/netpi/ip_address') }}
    volumes:
      - ./sftpgodata:/srv/sftpgo
      - ./sftpgohome:/var/lib/sftpgo
